<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー管理一覧</title>
	<link rel="stylesheet" th:href="@{/css/usersadmin.css}">
</head>
<body>
    <h1>ユーザー管理一覧</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>名前</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.name}">名前が入ります</td>
				<td>
				        <a th:href="@{/user/edit(id=${user.id})}">編集する</a>
				    </td>
            </tr>
        </tbody>
    </table>
    
    <p><a th:href="@{/user}">マイページへ</a></p>
</body>
</html>
