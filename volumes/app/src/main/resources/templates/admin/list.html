<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <meta charset="UTF-8">
    <link rel="stylesheet" media="all" th:href="@{/css/admin.css}" />
    <title>管理画面一覧</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon3.png}">
</head>
<body>
	
	<h1>管理者用ダッシュボード</h1>
<h2>お問い合わせ一覧</h2>

<a th:href="@{/admin/logout}" class="btn-logout">ログアウト</a>

<div th:if="${message}" style="color: forestgreen; font-weight: bold; margin-bottom: 15px;">
    <span th:text="${message}"></span>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>メールアドレス</th>
            <th>お問い合わせ内容</th>
            <th>アクション</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="inquiry : ${inquiries}" th:id="'inquiry-row-' + ${inquiry.id}">
            <td th:text="${inquiry.id}"></td>
            <td th:text="${inquiry.name}"></td>
            <td th:text="${inquiry.mail}"></td>
            <td th:text="${inquiry.content}"></td>
            <td>
                <button type="button" 
                        class="btn-delete ajax-delete-btn" 
                        th:data-url="@{/admin/products/inquiry/delete/{id}(id=${inquiry.id})}"
                        th:data-row-id="'inquiry-row-' + ${inquiry.id}">
                    削除
                </button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(inquiries)}">
            <td colspan="5">お問い合わせはありません</td>
        </tr>
    </tbody>
</table>

<hr>

<h2>商品一覧管理編集</h2>

<div style="text-align: center; margin-bottom: 20px;">
    <a th:href="@{/admin/products/new}" class="btn-new">＋ 新規商品を追加する</a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>商品名</th>
            <th>価格</th>
            <th>商品詳細</th>
            <th>総在庫</th>
            <th>在庫内訳</th>
            <th>人気度</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="product : ${products}" th:id="'product-row-' + ${product.id}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}" style="font-weight: bold;"></td>
            <td th:text="${#numbers.formatInteger(product.price, 1, 'COMMA') + '円'}"></td>   
            <td th:text="${product.description}"></td>
            
            <td th:with="totalStock=${product.variants != null ? #aggregates.sum(product.variants.![stock]) : 0}"
                th:text="${totalStock != null ? totalStock : 0}">
            </td>
            
            <td>
                <ul style="list-style: none; padding: 0; margin: 0; font-size: 0.85em;">
                    <li th:each="variant : ${product.variants}">
                        <span th:text="${variant.color != null ? variant.color.label : 'F'}"></span> /
                        <span th:text="${variant.size != null ? variant.size.label : 'F'}"></span> :
                        <strong th:text="${variant.stock}"></strong>個
                    </li>
                </ul>
            </td>

            <td>
                <span th:if="${#lists.size(product.favorites) > 0}" style="color: orange; font-weight: bold;">
                    ★ <span th:text="${#lists.size(product.favorites)}"></span>件
                </span>
            </td>

            <td>
                <div style="gap: 5px; display: flex; align-items: center;">
                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn-edit">編集</a>
                    <button type="button" 
                            class="btn-delete ajax-delete-btn" 
                            th:data-url="@{/admin/products/delete/{id}(id=${product.id})}"
                            th:data-row-id="'product-row-' + ${product.id}">
                        削除
                    </button>
                </div>
            </td>
        </tr>
    </tbody>
</table>

<script th:inline="javascript">
/*<![CDATA[*/
    // 初期表示時のメッセージ（もしあれば）を表示
    const errorMsg = /*[[${errorMessage}]]*/ null;
    if (errorMsg) alert(errorMsg);

    const successMsg = /*[[${message}]]*/ null;
    if (successMsg) alert(successMsg);

    // 全ての削除ボタンに対してクリックイベントを設定
    document.querySelectorAll('.ajax-delete-btn').forEach(button => {
        button.addEventListener('click', function() {
            const url = this.getAttribute('data-url'); // 送信先URL
            const rowId = this.getAttribute('data-row-id'); // 消去する行のID

            if (!confirm('本当に削除しますか？')) return;

            // metaタグからCSRFトークンを取得（Spring Security対策）
            const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            // 非同期通信（Fetch API）の実行
            fetch(url, {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest', // Ajaxリクエストであることを明示
                    [header]: token // CSRFトークンをヘッダーにセット
                }
            })
            .then(response => {
                if (response.ok) {
                    // 削除成功時：対象の行をフェードアウトさせて削除
                    const row = document.getElementById(rowId);
                    row.style.transition = 'opacity 0.5s';
                    row.style.opacity = '0';
                    setTimeout(() => row.remove(), 500);
                } else if (response.status === 400) {
                    // バリデーションエラー（お気に入り登録がある場合など）
                    alert('削除できません。お気に入り登録されている可能性があります。');
                } else {
                    alert('削除に失敗しました（エラーコード: ' + response.status + '）');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('通信エラーが発生しました。');
            });
        });
    });
/*]]>*/
</script>

</body>
</html>
